[tool.bumpversion]
current_version = "0.3.0"
commit = true
tag = false

[[tool.bumpversion.files]]
filename = "taglyatelle/exposition/taglyatelle_api.py"
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "docs/mkdocs.yml"
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "README.md"
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "Justfile"
search = "{current_version}"
replace = "{new_version}"
