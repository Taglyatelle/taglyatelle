[coverage:run]
# uncomment the following to omit files during running
#omit =
[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    def main

[tox:tox]
min_version = 4.34.1
env_list = python3.12

[testenv]
skip_install = true
allowlist_externals = just
commands_pre = just install-prod
commands = just unittest
