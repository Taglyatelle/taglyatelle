exclude: '^(\.+|notebooks|docs|htmlcov|dist|build|site|config|data)|coverage.xml$'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
      - id: check-case-conflict
      - id: debug-statements
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-check
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format
  - repo: local
    hooks:
    - id: mypy
      name: mypy
      entry: uv run mypy
      language: system
      'types_or': [python]
      require_serial: true
      exclude: |
            (?x)^(
                tests
            )
