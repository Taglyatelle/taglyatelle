name: Deploy docker images to GHCR

on:
  push:
    tags: '*'

env:
  REGISTRY: ghcr.io

jobs:
      build-and-publish-docker-image:
        runs-on: ubuntu-latest

        permissions:
          contents: read
          packages: write

        steps:
          - name: Checkout
            uses: actions/checkout@v6

          - name: Login to GitHub Container Registry
            uses: docker/login-action@v3
            with:
              registry: ${{env.REGISTRY}}
              username: ${{github.actor}}
              password: ${{secrets.GITHUB_TOKEN}}

          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3

          - name: Set image name and tag to lowercase
            run: |
              echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
              echo "IMAGE_TAG=$(echo '${{ github.ref_name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

          - name: Build and push
            uses: docker/build-push-action@v6
            with:
              context: .
              file: ./Dockerfile
              push: true
              tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
