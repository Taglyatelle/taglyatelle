[project]
name = "taglyatelle"
version = "0.1.0"
homepage = "https://github.com/Taglyatelle/taglyatelle"
description = "Delegate tasks to your AI agent on multiple Git hosting services"
authors = [{ name = "Alex MARTINEZ" }]
requires-python = ">=3.11,<4.0"
keywords = [
  "uv", "requirements", "packaging"
]
classifiers=[
    'Intended Audience :: Developers',
    'Natural Language :: English',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
]
readme = "README.md"
packages = [
    { include = "taglyatelle"},
    { include = "tests", format = "sdist" },
]

dependencies = [

]

[project.optional-dependencies]
typing = [
    "types-requests>=2.32.4.20250913",
    "mypy>=1.19.1",
    "types-pyyaml>=6.0.12.20250915",
    "typing-inspection>=0.4.2",
    "typing_extensions",
    "types-aiofiles>=25.1.0.20251011"
]

test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "tox>=4.34.1"
]

dev = [
    "bump-my-version>=1.2.6"
]

doc = [
    "mkdocs",
    "mkdocs-include-markdown-plugin>=7.2.0",
    "mkdocs-material>=9.7.1",
    "mkdocstrings>=0.30.1",
    "mkdocstrings-python",
    "mkdocs-material-extensions",
    "pytkdocs",
    "mkdocs-autorefs",
    "mkdocs-gen-files>=0.6.0",
    "mkdocs-literate-nav",
    "jinja2",
    "MarkupSafe>=3.0.3"
]

[tool.ruff]
# Same as Black and isort line length
line-length = 120

# Equivalent to flake8's min_python_version
target-version = "py39"

# Include patterns (equivalent to Black's include)
include = ["*.py", "*.pyi"]

# Exclude patterns (combining all your exclude patterns)
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "docs",
    "config",
    "notebooks",
    "data",
    "setup.cfg",
    "*.toml",
    "*.yml",
    "Justfile",
    "*.md",
    "tests",
    "*.pyi"
]

[tool.ruff.lint]
# Enable the rules you want - equivalent to flake8 + additional rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "D",   # pydocstyle (docstrings)
    "C90", # mccabe complexity
]

# Ignore rules (equivalent to your flake8 ignore)
ignore = [
    "E203",  # whitespace before ':'
    "E266",  # too many leading '#' for block comment
    "E7",    # multiple statements on one line (E70x)
    "W6",    # deprecated warnings (W60x)
    "C901",  # too complex (handled by max-complexity below)
    "D2",    # Missing docstrings (D20x, D21x)
    "D3",    # Triple double quotes (D30x, D31x)
    "D4",    # Docstring content (D40x, D41x, D42x)
]

[tool.ruff.lint.mccabe]
# Equivalent to flake8's max-complexity
max-complexity = 21

[tool.ruff.format]
# Equivalent to Black configuration
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

